<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人筆記整理網站</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 引入輕量 Markdown 解析器 (marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 行動裝置頂部列 -->
    <header class="mobile-bar">
      <button class="menu-toggle-btn" id="menu-toggle-btn" title="切換選單">☰</button>
      <div class="site-title">📓 個人筆記</div>
      <div></div>
    </header>

    <!-- 側邊欄 (Sidebar) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="site-title">
          <span>📓</span>
          <span>個人筆記</span>
        </div>
        <button class="theme-toggle-btn" id="theme-toggle-btn" title="切換深淺色模式">🌙</button>
      </div>

      <!-- 搜尋列 -->
      <div class="search-container">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="搜尋主題、摘要或標籤..."
          autocomplete="off"
        >
      </div>

      <!-- 標籤篩選列 -->
      <div class="tags-bar" id="tags-bar">
        <!-- 由 JavaScript 動態生成 -->
      </div>

      <!-- 筆記主題列表 -->
      <nav class="notes-nav">
        <div class="notes-section-title">主題列表</div>
        <div id="notes-list">
          <!-- 由 JavaScript 動態載入主題 -->
        </div>
      </nav>
    </aside>

    <!-- 主閱讀視窗 -->
    <main class="main-content">
      <div class="content-inner">
        <article class="markdown-body" id="note-content">
          <div class="empty-state">
            <span class="empty-icon">📖</span>
            <p>正在載入筆記內容...</p>
          </div>
        </article>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
